<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dead Monster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: #222;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff4444;
        }
        #game-over h1 {
            color: #ff4444;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Health: <span id="health">100</span></div>
            <div>Ammo: <span id="ammo">10</span>/10 (PC: Press R)</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h1>YOU DIED</h1>
            <p>Your Score: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
    }

    window.addEventListener('resize', resizeCanvas);

    let score = 0;
    let health = 100;
    let maxAmmo = 10;
    let ammo = 10;
    let isGameOver = false;

    const player = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        radius: 20,
        color: "#3498db"
    };

    let bullets = [];
    let zombies = [];
    let spawnTimer = 0;

    function shoot(targetX, targetY) {
        if (isGameOver) return;
        if (ammo > 0) {
            ammo--;
            updateUI();
            
            const angle = Math.atan2(targetY - player.y, targetX - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 12,
                dy: Math.sin(angle) * 12,
                radius: 4
            });
        } else {
            // Mobile Auto-Reload when empty
            ammo = maxAmmo;
            updateUI();
        }
    }

    // Mouse click for PC
    window.addEventListener("click", (e) => {
        shoot(e.clientX, e.clientY);
    });

    // Touch tap for Mobile
    window.addEventListener("touchstart", (e) => {
        if (e.touches.length > 0) {
            shoot(e.touches[0].clientX, e.touches[0].clientY);
        }
    });

    // Keyboard Reload for PC ('R')
    window.addEventListener("keydown", (e) => {
        if (e.key === 'r' || e.key === 'R') {
            ammo = maxAmmo;
            updateUI();
        }
    });

    function spawnZombie() {
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? 0 : canvas.width;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? 0 : canvas.height;
        }
        zombies.push({
            x: x,
            y: y,
            radius: 18,
            speed: 1.5 + Math.random() * 1.5,
            color: "#2ecc71"
        });
    }

    function updateUI() {
        document.getElementById("score").innerText = score;
        document.getElementById("health").innerText = health;
        document.getElementById("ammo").innerText = `${ammo}/${maxAmmo}`;
    }

    function gameLoop() {
        if (isGameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.closePath();

        // Update Bullets
        bullets.forEach((bullet, index) => {
            bullet.x += bullet.dx;
            bullet.y += bullet.dy;

            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#f1c40f";
            ctx.fill();
            ctx.closePath();

            if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                bullets.splice(index, 1);
            }
        });

        // Spawn Zombies
        spawnTimer++;
        if (spawnTimer % 50 === 0) {
            spawnZombie();
        }

        // Update Zombies
        zombies.forEach((zombie, zIndex) => {
            const angle = Math.atan2(player.y - zombie.y, player.x - zombie.x);
            zombie.x += Math.cos(angle) * zombie.speed;
            zombie.y += Math.sin(angle) * zombie.speed;

            ctx.beginPath();
            ctx.arc(zombie.x, zombie.y, zombie.radius, 0, Math.PI * 2);
            ctx.fillStyle = zombie.color;
            ctx.fill();
            ctx.closePath();

            // Collision with Player
            const distToPlayer = Math.hypot(player.x - zombie.x, player.y - zombie.y);
            if (distToPlayer < player.radius + zombie.radius) {
                health -= 1;
                updateUI();
                if (health <= 0) {
                    isGameOver = true;
                    document.getElementById("final-score").innerText = score;
                    document.getElementById("game-over").style.display = "block";
                }
            }

            // Collision with Bullets
            bullets.forEach((bullet, bIndex) => {
                const distToBullet = Math.hypot(bullet.x - zombie.x, bullet.y - zombie.y);
                if (distToBullet < zombie.radius + bullet.radius) {
                    zombies.splice(zIndex, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                    updateUI();
                }
            });
        });

        requestAnimationFrame(gameLoop);
    }

    function restartGame() {
        score = 0;
        health = 100;
        ammo = maxAmmo;
        isGameOver = false;
        bullets = [];
        zombies = [];
        document.getElementById("game-over").style.display = "none";
        updateUI();
        gameLoop();
    }

    resizeCanvas();
    gameLoop();
</script>

</body>
</html>
