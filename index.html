<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dead Monster - 3D FPS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 4px;
            height: 4px;
            background: red;
            border-radius: 50%;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-size: 14px;
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            background: rgba(20, 0, 0, 0.9);
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #ff3333;
            text-align: center;
            color: #fff;
        }
        #game-over h1 {
            color: #ff3333;
            margin-top: 0;
            font-size: 36px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #ff3333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover {
            background: #cc0000;
        }
    </style>
    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Health: <span id="health">100</span></div>
        <div>Ammo: <span id="ammo">12</span>/12 (Press R)</div>
    </div>
    <div id="crosshair"></div>
    <div id="instructions">Click screen/canvas to lock mouse & shoot. Use WASD to move, Mouse to aim, R to reload.</div>
    
    <div id="game-over">
        <h1>YOU DIED</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <div id="canvas-container"></div>

<script>
    let scene, camera, renderer;
    let score = 0, health = 100, maxAmmo = 12, ammo = 12;
    let isGameOver = false;
    let zombies = [];
    let bullets = [];
    
    // Movement flags
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();

    function init() {
        // Scene setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.035);

        // Camera setup
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2;

        // Renderer setup
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff5500, 1, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Ground (Dark tactical floor)
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid lines for high-tech look
        const grid = new THREE.GridHelper(200, 50, 0x00ffcc, 0x333333);
        grid.position.y = 0.01;
        scene.add(grid);

        // Event Listeners
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('click', onClick);

        // Pointer Lock for FPS mouse look
        const container = document.getElementById('canvas-container');
        container.addEventListener('click', () => {
            container.requestPointerLock();
        });

        document.addEventListener('mousemove', onMouseMove);

        animate();
    }

    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    function onMouseMove(event) {
        if (document.pointerLockElement !== document.getElementById('canvas-container')) return;

        const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
        const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

        euler.setFromQuaternion(camera.quaternion);
        euler.y -= movementX * 0.002;
        euler.x -= movementY * 0.002;
        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
        camera.quaternion.setFromEuler(euler);
    }

    function onKeyDown(e) {
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
        if (e.code === 'KeyR') {
            ammo = maxAmmo;
            updateUI();
        }
    }

    function onKeyUp(e) {
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
    }

    function onClick() {
        if (isGameOver) return;
        if (ammo > 0) {
            ammo--;
            updateUI();

            // Create Bullet ray or projectile
            const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);
            
            const vector = new THREE.Vector3(0, 0, -1);
            vector.applyQuaternion(camera.quaternion);
            bullet.velocity = vector.multiplyScalar(2);

            scene.add(bullet);
            bullets.push(bullet);
        }
    }

    function spawnZombie() {
        if (isGameOver) return;

        // Create a 3D Monster/Zombie geometry block model
        const zombieGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.5 });
        
        // Torso
        const torsoGeo = new THREE.BoxGeometry(0.8, 1.2, 0.4);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.y = 1;
        zombieGroup.add(torso);

        // Head
        const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x556b2f });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.8;
        zombieGroup.add(head);

        // Random spawn around player
        const angle = Math.random * Math.PI * 2;
        const radius = 30 + Math.random() * 20;
        zombieGroup.position.x = camera.position.x + Math.cos(angle) * radius;
        zombieGroup.position.z = camera.position.z + Math.sin(angle) * radius;
        zombieGroup.position.y = 0;

        scene.add(zombieGroup);
        zombies.push(zombieGroup);
    }

    // Spawn zombies periodically
    setInterval(spawnZombie, 1500);

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('health').innerText = health;
        document.getElementById('ammo').innerText = `${ammo}/${maxAmmo}`;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        if (isGameOver) return;

        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        // Player Movement physics
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(-velocity.z * delta);
        camera.position.y = 2; // Lock height

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.position.add(b.velocity);

            // Check collision with zombies
            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                if (b.position.distanceTo(z.position) < 1.2) {
                    scene.remove(z);
                    zombies.splice(j, 1);
                    scene.remove(b);
                    bullets.splice(i, 1);
                    score += 100;
                    updateUI();
                    break;
                }
            }

            // Remove out of bounds bullets
            if (b && b.position.distanceTo(camera.position) > 100) {
                scene.remove(b);
                bullets.splice(i, 1);
            }
        }

        // Update Zombies (Move towards player)
        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            z.lookAt(camera.position.x, z.position.y, camera.position.z);
            z.translateZ(0.04); // Zombie speed

            // Check attack player
            if (z.position.distanceTo(camera.position) < 1.5) {
                health -= 1;
                updateUI();
                if (health <= 0) {
                    isGameOver = false; // Stop loop
                    document.getElementById('final-score').innerText = score;
                    document.getElementById('game-over').style.display = 'block';
                    document.exitPointerLock();
                    isGameOver = true;
                }
            }
        }

        prevTime = time;
        renderer.render(scene, camera);
    }

    function restartGame() {
        score = 0;
        health = 100;
        ammo = maxAmmo;
        isGameOver = false;
        document.getElementById('game-over').style.display = 'none';
        
        zombies.forEach(z => scene.remove(z));
        zombies = [];
        bullets.forEach(b => scene.remove(b));
        bullets = [];
        
        camera.position.set(0, 2, 0);
        updateUI();
        animate();
    }

    init();
</script>

</body>
</html>
